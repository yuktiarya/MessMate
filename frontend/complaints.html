<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complaints | MessMate</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

    <div class="dashboard-wrapper page-fade-in">
        
        <aside class="sidebar">
            <div class="sidebar-header">
                <a href="index.html" class="sidebar-brand">
                    <i class="bi bi-egg-fried text-primary-custom"></i>
                    MessMate
                </a>
            </div>
            <ul class="sidebar-menu">
                <li class="sidebar-item"><a href="dashboard.html" class="sidebar-link"><i class="bi bi-grid-1x2"></i> Dashboard</a></li>
                <li class="sidebar-item"><a href="menu.html" class="sidebar-link"><i class="bi bi-calendar4-week"></i> Today's Menu</a></li>
                <li class="sidebar-item"><a href="feedback.html" class="sidebar-link"><i class="bi bi-star"></i> Meal Feedback</a></li>
                <li class="sidebar-item"><a href="complaints.html" class="sidebar-link active"><i class="bi bi-exclamation-square"></i> Complaints</a></li>
                <li class="sidebar-item"><a href="polls.html" class="sidebar-link"><i class="bi bi-bar-chart-steps"></i> Polls</a></li>
                <li class="sidebar-item"><a href="analytics.html" class="sidebar-link"><i class="bi bi-graph-up"></i> Analytics</a></li>
            </ul>
            <div class="sidebar-footer">
                <a href="profile.html" class="sidebar-link"><i class="bi bi-person"></i> Profile</a>
            </div>
        </aside>

        <main class="main-content">
            <header class="dashboard-navbar">
                <div class="d-flex align-items-center gap-3">
                    <button class="sidebar-toggler"><i class="bi bi-list"></i></button>
                    <h4 class="mb-0 fw-bold d-none d-md-block">Complaints</h4>
                </div>
                <div class="d-flex align-items-center gap-3">
                    <button class="theme-toggle" title="Toggle Dark Mode"><i class="bi bi-moon-stars-fill"></i></button>
                    <div class="dropdown user-dropdown">
                        <button class="dropdown-toggle" type="button" data-bs-toggle="dropdown">
                            <img src="" alt="User" class="user-avatar-img">
                            <span class="d-none d-md-inline user-name-text">Student</span>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="profile.html"><i class="bi bi-person me-2"></i>Profile</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item text-danger" href="index.html"><i class="bi bi-box-arrow-right me-2"></i>Logout</a></li>
                        </ul>
                    </div>
                </div>
            </header>

            <div class="dashboard-content-scroll">
                
                <div class="row g-4">
                    <!-- Submit Complaint Form -->
                    <div class="col-lg-5">
                        <div class="card border-0 h-100">
                            <div class="card-header bg-transparent border-0 pt-4 pb-0">
                                <h5 class="fw-bold mb-0">File a New Complaint</h5>
                            </div>
                            <div class="card-body">
                                <form id="complaint-form">
                                    <div class="mb-3">
                                        <label class="form-label fw-bold">Title</label>
                                        <input type="text" class="form-control" id="c-title" placeholder="Brief summary of the issue" required>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label fw-bold">Category</label>
                                        <select class="form-select" id="c-category" required>
                                            <option value="" disabled selected>Select category...</option>
                                            <option value="Hygiene">Hygiene</option>
                                            <option value="Food Quality">Food Quality</option>
                                            <option value="Quantity">Quantity</option>
                                            <option value="Late Serving">Late Serving</option>
                                            <option value="Staff Behaviour">Staff Behaviour</option>
                                            <option value="Other">Other</option>
                                        </select>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label fw-bold">Description</label>
                                        <textarea class="form-control" id="c-desc" rows="4" placeholder="Detailed description..." required></textarea>
                                    </div>
                                    <div class="mb-4 form-check">
                                        <input type="checkbox" class="form-check-input" id="c-anonymous">
                                        <label class="form-check-label" for="c-anonymous">Submit Anonymously</label>
                                    </div>
                                    <button type="submit" class="btn btn-primary w-100">Submit Complaint</button>
                                </form>
                            </div>
                        </div>
                    </div>

                    <!-- Previous Complaints -->
                    <div class="col-lg-7">
                        <div class="card border-0 h-100">
                            <div class="card-header bg-transparent border-0 pt-4 pb-0 d-flex justify-content-between align-items-center">
                                <h5 class="fw-bold mb-0">My Complaints</h5>
                                <div class="d-flex gap-2">
                                    <select class="form-select form-select-sm" id="filter-category" style="width: auto;">
                                        <option value="All">All Categories</option>
                                        <option value="Hygiene">Hygiene</option>
                                        <option value="Food Quality">Food Quality</option>
                                        <option value="Quantity">Quantity</option>
                                        <option value="Late Serving">Late Serving</option>
                                        <option value="Staff Behaviour">Staff Behaviour</option>
                                    </select>
                                </div>
                            </div>
                            <div class="card-body">
                                <div class="mb-3">
                                    <input type="text" class="form-control" id="search-complaint" placeholder="Search complaints...">
                                </div>
                                <div id="complaints-list" class="d-flex flex-column gap-3" style="max-height: 500px; overflow-y: auto; padding-right: 5px;">
                                    <!-- Populated by JS -->
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script src="js/complaints.js"></script>
</body>
</html>
