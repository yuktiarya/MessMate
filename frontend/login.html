<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | MessMate</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="d-flex align-items-center justify-content-center vh-100 page-fade-in" style="background-color: var(--bg-color);">

    <div class="card border-0 shadow-lg p-4" style="width: 100%; max-width: 400px; border-radius: 16px;">
        <div class="text-center mb-4">
            <h2 class="fw-bold text-primary-custom">MessMate</h2>
            <p class="text-muted">Welcome back! Please login.</p>
        </div>
        
        <div id="login-error" class="alert alert-danger d-none small"></div>

        <form id="login-form">
            <div class="mb-3">
                <label class="form-label fw-bold">Email</label>
                <input type="email" class="form-control" id="login-email" required placeholder="student@college.edu">
            </div>
            <div class="mb-4">
                <label class="form-label fw-bold">Password</label>
                <input type="password" class="form-control" id="login-password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-primary w-100 mb-3" id="login-btn">Login</button>
            <div class="text-center">
                <small class="text-muted">Don't have an account? <a href="register.html">Register</a></small>
            </div>
        </form>
    </div>

    <!-- The app.js handles the login logic via fetch -->
    <script src="js/app.js"></script>
</body>
</html>
