<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polls | MessMate</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/responsive.css">
    <style>
        .poll-option {
            cursor: pointer;
            transition: var(--transition);
        }
        .poll-option:hover {
            background-color: var(--bg-color);
        }
        .poll-option.voted {
            border-color: var(--primary-color) !important;
            background-color: rgba(255, 107, 107, 0.05);
        }
        .poll-option.voted .bi-circle {
            display: none;
        }
        .poll-option:not(.voted) .bi-check-circle-fill {
            display: none;
        }
    </style>
</head>
<body>

    <div class="dashboard-wrapper page-fade-in">
        
        <aside class="sidebar">
            <div class="sidebar-header">
                <a href="index.html" class="sidebar-brand">
                    <i class="bi bi-egg-fried text-primary-custom"></i>
                    MessMate
                </a>
            </div>
            <ul class="sidebar-menu">
                <li class="sidebar-item"><a href="dashboard.html" class="sidebar-link"><i class="bi bi-grid-1x2"></i> Dashboard</a></li>
                <li class="sidebar-item"><a href="menu.html" class="sidebar-link"><i class="bi bi-calendar4-week"></i> Today's Menu</a></li>
                <li class="sidebar-item"><a href="feedback.html" class="sidebar-link"><i class="bi bi-star"></i> Meal Feedback</a></li>
                <li class="sidebar-item"><a href="complaints.html" class="sidebar-link"><i class="bi bi-exclamation-square"></i> Complaints</a></li>
                <li class="sidebar-item"><a href="polls.html" class="sidebar-link active"><i class="bi bi-bar-chart-steps"></i> Polls</a></li>
                <li class="sidebar-item"><a href="analytics.html" class="sidebar-link"><i class="bi bi-graph-up"></i> Analytics</a></li>
            </ul>
            <div class="sidebar-footer">
                <a href="profile.html" class="sidebar-link"><i class="bi bi-person"></i> Profile</a>
            </div>
        </aside>

        <main class="main-content">
            <header class="dashboard-navbar">
                <div class="d-flex align-items-center gap-3">
                    <button class="sidebar-toggler"><i class="bi bi-list"></i></button>
                    <h4 class="mb-0 fw-bold d-none d-md-block">Food Polls</h4>
                </div>
                <div class="d-flex align-items-center gap-3">
                    <button class="theme-toggle" title="Toggle Dark Mode"><i class="bi bi-moon-stars-fill"></i></button>
                    <div class="dropdown user-dropdown">
                        <button class="dropdown-toggle" type="button" data-bs-toggle="dropdown">
                            <img src="" alt="User" class="user-avatar-img">
                            <span class="d-none d-md-inline user-name-text">Student</span>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="profile.html"><i class="bi bi-person me-2"></i>Profile</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item text-danger" href="index.html"><i class="bi bi-box-arrow-right me-2"></i>Logout</a></li>
                        </ul>
                    </div>
                </div>
            </header>

            <div class="dashboard-content-scroll">
                
                <div class="row justify-content-center">
                    <div class="col-lg-8" id="polls-container">
                        <!-- Populated by JS -->
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script src="js/polls.js"></script>
</body>
</html>
