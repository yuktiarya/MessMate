<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Today's Menu | MessMate</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

    <div class="dashboard-wrapper page-fade-in">
        
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <a href="index.html" class="sidebar-brand">
                    <i class="bi bi-egg-fried text-primary-custom"></i>
                    MessMate
                </a>
            </div>
            <ul class="sidebar-menu">
                <li class="sidebar-item">
                    <a href="dashboard.html" class="sidebar-link">
                        <i class="bi bi-grid-1x2"></i> Dashboard
                    </a>
                </li>
                <li class="sidebar-item">
                    <a href="menu.html" class="sidebar-link active">
                        <i class="bi bi-calendar4-week"></i> Today's Menu
                    </a>
                </li>
                <li class="sidebar-item">
                    <a href="feedback.html" class="sidebar-link">
                        <i class="bi bi-star"></i> Meal Feedback
                    </a>
                </li>
                <li class="sidebar-item">
                    <a href="complaints.html" class="sidebar-link">
                        <i class="bi bi-exclamation-square"></i> Complaints
                    </a>
                </li>
                <li class="sidebar-item">
                    <a href="polls.html" class="sidebar-link">
                        <i class="bi bi-bar-chart-steps"></i> Polls
                    </a>
                </li>
                <li class="sidebar-item">
                    <a href="analytics.html" class="sidebar-link">
                        <i class="bi bi-graph-up"></i> Analytics
                    </a>
                </li>
            </ul>
            <div class="sidebar-footer">
                <a href="profile.html" class="sidebar-link">
                    <i class="bi bi-person"></i> Profile
                </a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Top Navbar -->
            <header class="dashboard-navbar">
                <div class="d-flex align-items-center gap-3">
                    <button class="sidebar-toggler">
                        <i class="bi bi-list"></i>
                    </button>
                    <h4 class="mb-0 fw-bold d-none d-md-block">Today's Menu</h4>
                </div>
                
                <div class="d-flex align-items-center gap-3">
                    <button class="theme-toggle" title="Toggle Dark Mode">
                        <i class="bi bi-moon-stars-fill"></i>
                    </button>
                    
                    <div class="dropdown user-dropdown">
                        <button class="dropdown-toggle" type="button" data-bs-toggle="dropdown">
                            <img src="" alt="User" class="user-avatar-img">
                            <span class="d-none d-md-inline user-name-text">Student</span>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="profile.html"><i class="bi bi-person me-2"></i>Profile</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item text-danger" href="index.html"><i class="bi bi-box-arrow-right me-2"></i>Logout</a></li>
                        </ul>
                    </div>
                </div>
            </header>

            <!-- Dashboard Scrollable Content -->
            <div class="dashboard-content-scroll">
                
                <!-- Date Header -->
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h5 class="fw-bold mb-1" id="current-date">Loading date...</h5>
                        <p class="text-muted mb-0">Here's what is being served today.</p>
                    </div>
                    <div>
                        <a href="feedback.html" class="btn btn-primary"><i class="bi bi-star me-2"></i>Rate Meal</a>
                    </div>
                </div>

                <!-- Menu Sections -->
                <div class="row g-4">
                    <!-- Breakfast -->
                    <div class="col-12">
                        <div class="card border-0">
                            <div class="card-header bg-transparent border-0 pt-4 pb-0 d-flex align-items-center gap-2">
                                <div class="icon-box rounded bg-warning-subtle text-warning d-flex align-items-center justify-content-center" style="width: 40px; height: 40px;">
                                    <i class="bi bi-cup-hot"></i>
                                </div>
                                <h4 class="fw-bold mb-0">Breakfast</h4>
                                <span class="badge bg-light text-dark ms-auto border">07:30 AM - 09:30 AM</span>
                            </div>
                            <div class="card-body">
                                <div class="row g-4" id="breakfast-container">
                                    <div class="col-12"><div class="skeleton" style="height: 100px;"></div></div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Lunch -->
                    <div class="col-12">
                        <div class="card border-0">
                            <div class="card-header bg-transparent border-0 pt-4 pb-0 d-flex align-items-center gap-2">
                                <div class="icon-box rounded bg-primary-subtle text-primary d-flex align-items-center justify-content-center" style="width: 40px; height: 40px;">
                                    <i class="bi bi-brightness-high"></i>
                                </div>
                                <h4 class="fw-bold mb-0">Lunch</h4>
                                <span class="badge bg-light text-dark ms-auto border">12:30 PM - 02:30 PM</span>
                            </div>
                            <div class="card-body">
                                <div class="row g-4" id="lunch-container">
                                    <div class="col-12"><div class="skeleton" style="height: 100px;"></div></div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Dinner -->
                    <div class="col-12">
                        <div class="card border-0">
                            <div class="card-header bg-transparent border-0 pt-4 pb-0 d-flex align-items-center gap-2">
                                <div class="icon-box rounded bg-success-subtle text-success d-flex align-items-center justify-content-center" style="width: 40px; height: 40px;">
                                    <i class="bi bi-moon-stars"></i>
                                </div>
                                <h4 class="fw-bold mb-0">Dinner</h4>
                                <span class="badge bg-light text-dark ms-auto border">07:30 PM - 09:30 PM</span>
                            </div>
                            <div class="card-body">
                                <div class="row g-4" id="dinner-container">
                                    <div class="col-12"><div class="skeleton" style="height: 100px;"></div></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <!-- Bootstrap Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- App JS -->
    <script src="js/app.js"></script>
    <script src="js/menu.js"></script>
</body>
</html>
