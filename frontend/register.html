<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | MessMate</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 page-fade-in py-5" style="background-color: var(--bg-color);">

    <div class="card border-0 shadow-lg p-4" style="width: 100%; max-width: 450px; border-radius: 16px;">
        <div class="text-center mb-4">
            <h2 class="fw-bold text-primary-custom">MessMate</h2>
            <p class="text-muted">Create your student account.</p>
        </div>
        
        <div id="register-error" class="alert alert-danger d-none small"></div>

        <form id="register-form">
            <div class="mb-3">
                <label class="form-label fw-bold">Full Name</label>
                <input type="text" class="form-control" id="reg-name" required placeholder="John Doe">
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold">Email</label>
                <input type="email" class="form-control" id="reg-email" required placeholder="student@college.edu">
            </div>
            <div class="row mb-3">
                <div class="col-6">
                    <label class="form-label fw-bold">Hostel Block</label>
                    <input type="text" class="form-control" id="reg-block" required placeholder="e.g. Block A">
                </div>
                <div class="col-6">
                    <label class="form-label fw-bold">Room No.</label>
                    <input type="text" class="form-control" id="reg-room" required placeholder="e.g. 101">
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label fw-bold">Password</label>
                <input type="password" class="form-control" id="reg-password" required placeholder="Min 6 characters" minlength="6">
            </div>
            <button type="submit" class="btn btn-primary w-100 mb-3" id="register-btn">Register</button>
            <div class="text-center">
                <small class="text-muted">Already have an account? <a href="login.html">Login</a></small>
            </div>
        </form>
    </div>

    <!-- The app.js handles the register logic via fetch -->
    <script src="js/app.js"></script>
</body>
</html>
