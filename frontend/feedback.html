<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meal Feedback | MessMate</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

    <div class="dashboard-wrapper page-fade-in">
        
        <aside class="sidebar">
            <div class="sidebar-header">
                <a href="index.html" class="sidebar-brand">
                    <i class="bi bi-egg-fried text-primary-custom"></i>
                    MessMate
                </a>
            </div>
            <ul class="sidebar-menu">
                <li class="sidebar-item"><a href="dashboard.html" class="sidebar-link"><i class="bi bi-grid-1x2"></i> Dashboard</a></li>
                <li class="sidebar-item"><a href="menu.html" class="sidebar-link"><i class="bi bi-calendar4-week"></i> Today's Menu</a></li>
                <li class="sidebar-item"><a href="feedback.html" class="sidebar-link active"><i class="bi bi-star"></i> Meal Feedback</a></li>
                <li class="sidebar-item"><a href="complaints.html" class="sidebar-link"><i class="bi bi-exclamation-square"></i> Complaints</a></li>
                <li class="sidebar-item"><a href="polls.html" class="sidebar-link"><i class="bi bi-bar-chart-steps"></i> Polls</a></li>
                <li class="sidebar-item"><a href="analytics.html" class="sidebar-link"><i class="bi bi-graph-up"></i> Analytics</a></li>
            </ul>
            <div class="sidebar-footer">
                <a href="profile.html" class="sidebar-link"><i class="bi bi-person"></i> Profile</a>
            </div>
        </aside>

        <main class="main-content">
            <header class="dashboard-navbar">
                <div class="d-flex align-items-center gap-3">
                    <button class="sidebar-toggler"><i class="bi bi-list"></i></button>
                    <h4 class="mb-0 fw-bold d-none d-md-block">Submit Feedback</h4>
                </div>
                <div class="d-flex align-items-center gap-3">
                    <button class="theme-toggle" title="Toggle Dark Mode"><i class="bi bi-moon-stars-fill"></i></button>
                    <div class="dropdown user-dropdown">
                        <button class="dropdown-toggle" type="button" data-bs-toggle="dropdown">
                            <img src="" alt="User" class="user-avatar-img">
                            <span class="d-none d-md-inline user-name-text">Student</span>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="profile.html"><i class="bi bi-person me-2"></i>Profile</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item text-danger" href="index.html"><i class="bi bi-box-arrow-right me-2"></i>Logout</a></li>
                        </ul>
                    </div>
                </div>
            </header>

            <div class="dashboard-content-scroll">
                <div class="row justify-content-center">
                    <div class="col-lg-8 col-xl-6">
                        <div class="card border-0 p-2 p-md-4">
                            <div class="card-body">
                                <div class="text-center mb-4">
                                    <h3 class="fw-bold">How was your meal?</h3>
                                    <p class="text-muted">Your feedback helps us improve the food quality.</p>
                                </div>

                                <form id="feedback-form">
                                    <!-- Meal Selection -->
                                    <div class="mb-4">
                                        <label class="form-label fw-bold">Which meal are you rating?</label>
                                        <select class="form-select form-select-lg" id="meal-select" required>
                                            <option value="" disabled selected>Select a meal...</option>
                                            <option value="Breakfast">Breakfast</option>
                                            <option value="Lunch">Lunch</option>
                                            <option value="Dinner">Dinner</option>
                                        </select>
                                    </div>

                                    <!-- Overall Rating -->
                                    <div class="mb-4 text-center">
                                        <label class="form-label fw-bold d-block">Overall Rating</label>
                                        <div class="star-rating d-flex justify-content-center gap-2" id="star-rating">
                                            <i class="bi bi-star-fill" data-rating="1"></i>
                                            <i class="bi bi-star-fill" data-rating="2"></i>
                                            <i class="bi bi-star-fill" data-rating="3"></i>
                                            <i class="bi bi-star-fill" data-rating="4"></i>
                                            <i class="bi bi-star-fill" data-rating="5"></i>
                                        </div>
                                        <input type="hidden" id="rating-value" value="0" required>
                                        <div class="text-danger small mt-1 d-none" id="rating-error">Please select a rating.</div>
                                    </div>

                                    <!-- Mood -->
                                    <div class="mb-4 text-center">
                                        <label class="form-label fw-bold d-block">How did it make you feel?</label>
                                        <div class="mood-selector">
                                            <button type="button" class="mood-btn" data-mood="Loved it" title="Loved it">😍</button>
                                            <button type="button" class="mood-btn" data-mood="Good" title="Good">🙂</button>
                                            <button type="button" class="mood-btn" data-mood="Average" title="Average">😐</button>
                                            <button type="button" class="mood-btn" data-mood="Bad" title="Bad">😖</button>
                                        </div>
                                        <input type="hidden" id="mood-value" value="" required>
                                        <div class="text-danger small mt-1 d-none" id="mood-error">Please select a mood.</div>
                                    </div>

                                    <!-- Additional Comments -->
                                    <div class="mb-4">
                                        <label class="form-label fw-bold">Additional Comments (Optional)</label>
                                        <textarea class="form-control" id="comment-text" rows="3" placeholder="Tell us what you liked or what could be better..."></textarea>
                                    </div>

                                    <button type="submit" class="btn btn-primary btn-lg w-100">Submit Feedback</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script src="js/feedback.js"></script>
</body>
</html>
